plugins {
    id("com.google.devtools.ksp")
}
apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply from: "../constants.gradle"
apply from: "../flavors.gradle"

android {
    namespace = project.ext.namespace
    compileSdk project.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion project.ext.minSdkVersion
        targetSdkVersion project.ext.targetSdkVersion
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility project.ext.javaVersion
        targetCompatibility project.ext.javaVersion
    }

    kotlinOptions {
        jvmTarget = project.ext.kotlinJvmTarget
    }

    packagingOptions {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES.txt',
                    'META-INF/DEPENDENCIES'
            ]
        }
        exclude "org/apache/http/version.properties"
        exclude "org/apache/http/client/version.properties"
    }

    configurations {
        configureEach {
            exclude group: "commons-logging", module: "commons-logging"
            exclude group: "org.apache.httpcomponents"
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    api "com.android.support:multidex:$multidexVersion"
    legacyApi "com.google.android.material:material:$materialVersion"
    modernApi "com.google.android.material:material:$materialVersionModern"
    legacyImplementation "androidx.media:media:$androidxMediaVersion"
    modernImplementation "androidx.media:media:$androidxMediaVersionModern"
    implementation group: "androidx.exifinterface", name: "exifinterface", version: "$exifinterfaceVersion"
    ksp("androidx.room:room-compiler:$roomVersion")
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    implementation "androidx.work:work-runtime-ktx:$workVersion"
    implementation "androidx.core:core-ktx:$kotlinCoreKtx"
    implementation "androidx.activity:activity-ktx:$kotlinActivityKtx"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinxCoroutinesAndroid"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlinxCoroutinesCore"
    legacyApi "androidx.media3:media3-exoplayer:$media3Version"
    modernApi "androidx.media3:media3-exoplayer:$media3VersionModern"
    legacyImplementation "androidx.media3:media3-datasource:$media3Version"
    modernImplementation "androidx.media3:media3-datasource:$media3VersionModern"
    legacyImplementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    modernImplementation "androidx.media3:media3-exoplayer-hls:$media3VersionModern"
    legacyImplementation "androidx.media3:media3-exoplayer-dash:$media3Version"
    modernImplementation "androidx.media3:media3-exoplayer-dash:$media3VersionModern"
    legacyApi "androidx.media3:media3-cast:$media3Version"
    modernApi "androidx.media3:media3-cast:$media3VersionModern"
    legacyImplementation "androidx.media3:media3-session:$media3Version"
    modernImplementation "androidx.media3:media3-session:$media3VersionModern"
    // FFmpeg audio decoders for Media3 (Jellyfin build): FLAC on Android < 8.1 and other codecs
    // the device lacks. Used only when no system decoder fits.
    legacyImplementation "org.jellyfin.media3:media3-ffmpeg-decoder:$media3Version+1"
    modernImplementation "org.jellyfin.media3:media3-ffmpeg-decoder:$media3VersionModern+1"
    // https://mvnrepository.com/artifact/com.squareup.okhttp3/okhttp
    legacyImplementation "com.squareup.okhttp3:okhttp:$okhttp3Version"
    modernImplementation "com.squareup.okhttp3:okhttp:$okhttp3VersionModern"
    // https://mvnrepository.com/artifact/org.jdom/jdom2
    implementation group: "org.jdom", name: "jdom2", version: "$jdom2Version"
    // https://mvnrepository.com/artifact/com.google.http-client/google-http-client-apache-v2
    implementation group: 'com.google.http-client', name: 'google-http-client-apache-v2', version: '1.43.3'

    // https://mvnrepository.com/artifact/junit/junit
    testImplementation group: "junit", name: "junit", version: "$junitVersion"
    testImplementation group: "org.json", name: "json", version: "$jsonTestVersion"
}
