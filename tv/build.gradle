plugins {
    id 'com.android.application'
    id 'kotlin-android'
}
apply from: "../constants.gradle"
apply from: "../sign.gradle"

android {
    namespace = "com.yuriy.openradio.tv"
    compileSdk project.ext.compileSdkVersion

    defaultConfig {
        applicationId project.ext.applicationId
        minSdk project.ext.minSdkVersionTv
        targetSdkVersion project.ext.targetSdkVersion
        versionCode project.ext.versionCode
        versionName project.ext.versionName
    }

    signingConfigs {
        config {
            if (project.ext.hasSignConfig) {
                keyAlias aliasProp
                keyPassword pwdProp
                storeFile file(storeFileProp)
                storePassword pwdProp
            }
        }
    }

    buildTypes {
        debug {
            if (project.ext.hasSignConfig) signingConfig signingConfigs.config
        }
        release {
            if (project.ext.hasSignConfig) signingConfig signingConfigs.config
        }
    }

    compileOptions {
        sourceCompatibility project.ext.javaVersion
        targetCompatibility project.ext.javaVersion
    }

    kotlinOptions {
        jvmTarget = project.ext.kotlinJvmTarget
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/NOTICE.md', 'META-INF/LICENSE.md']
        }
    }
}

dependencies {
    implementation project(':common')
    implementation project(':common-ui')

    implementation "androidx.leanback:leanback:$leanbackVersion"
    implementation "com.google.android.material:material:$materialVersion"
}
