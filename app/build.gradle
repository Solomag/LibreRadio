apply plugin: "com.android.application"
apply plugin: "kotlin-android"
apply from: "../constants.gradle"
apply from: "../flavors.gradle"
apply from: "../sign.gradle"

android {
    namespace = "com.yuriy.openradio.mobile"
    compileSdk project.ext.compileSdkVersion

    defaultConfig {
        applicationId project.ext.applicationId
        minSdkVersion project.ext.minSdkVersion
        targetSdkVersion project.ext.targetSdkVersion
        versionCode project.ext.versionCode
        versionName project.ext.versionName
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        // Needed by the FFmpeg decoder library.
        coreLibraryDesugaringEnabled true
        sourceCompatibility project.ext.javaVersion
        targetCompatibility project.ext.javaVersion
    }

    kotlinOptions {
        jvmTarget = project.ext.kotlinJvmTarget
    }

    signingConfigs {
        config {
            if (project.ext.hasSignConfig) {
                keyAlias aliasProp
                keyPassword pwdProp
                storeFile file(project.ext.storeFileProp)
                storePassword pwdProp
            }
        }
    }

    buildTypes {
        debug {
            if (project.ext.hasSignConfig) signingConfig signingConfigs.config
        }
        release {
            if (project.ext.hasSignConfig) signingConfig signingConfigs.config
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
    packagingOptions {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES.txt',
                    'META-INF/LICENSE.md',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE.md',
                    'META-INF/NOTICE.txt',
                    'META-INF/NOTICE',
                    'META-INF/LICENSE',
                    'META-INF/DEPENDENCIES',
                    'META-INF/notice.txt',
                    'META-INF/license.txt',
                    'META-INF/dependencies.txt',
                    'META-INF/LGPL2.1'
            ]
        }
    }

    lint {
        abortOnError false
    }

    // Jetpack Compose UI of the modern edition (app/src/modern). The legacy edition keeps the View UI.
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion project.ext.composeCompilerVersion
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
    implementation project(':common')
    implementation project(':common-ui')

    def composeBom = platform("androidx.compose:compose-bom:$composeBomVersion")
    modernImplementation composeBom
    modernImplementation "androidx.compose.ui:ui"
    modernImplementation "androidx.compose.material3:material3"
    modernImplementation "androidx.compose.material:material-icons-extended"
    modernImplementation "androidx.compose.ui:ui-tooling-preview"
    modernImplementation "androidx.activity:activity-compose:$activityComposeVersion"
    modernImplementation "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycleComposeVersion"
    modernImplementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycleComposeVersion"
    modernImplementation "io.coil-kt:coil-compose:$coilVersion"
    modernImplementation "androidx.media3:media3-session:$media3VersionModern"
    modernImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-guava:$kotlinxCoroutinesAndroid"
    // The Compose compiler plugin needs the runtime on the classpath for every variant;
    // legacy has no composables, so it is compile-only there (not packaged).
    legacyCompileOnly composeBom
    legacyCompileOnly "androidx.compose.runtime:runtime"

    androidTestImplementation(
            "androidx.test.espresso:espresso-core:$espressoVersion",
            {exclude group: "com.android.support", module: "support-annotations"}
    )
    androidTestImplementation "androidx.test.ext:junit:$junitAndroidXVersion"
}

android {
    productFlavors {
        // Same application ID; modern gets the higher version code so Android 7+ devices prefer it.
        legacy {
            versionCode project.ext.versionCode * 10
            versionNameSuffix "-legacy"
        }
        modern {
            versionCode project.ext.versionCode * 10 + 1
        }
    }
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            def suffix = variant.flavorName == "legacy" ? "-legacy" : ""
            def type = variant.buildType.name == "release" ? "" : "-${variant.buildType.name}"
            outputFileName = "LibreRadio-${project.ext.versionName}${suffix}${type}.apk"
        }
    }
}
