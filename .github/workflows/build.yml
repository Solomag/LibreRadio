# Builds all four editions on every push and pull request.
# Release builds are signed and published by hand (the signing key is not stored on GitHub),
# so CI makes debug APKs: proof that the code builds, plus test files to download.
name: Build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build phone (modern, legacy), TV and Automotive
        run: >
          ./gradlew --no-daemon
          :app:assembleModernDebug
          :app:assembleLegacyDebug
          :tv:assembleDebug
          :automotive:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: libreradio-debug-apks
          path: |
            app/build/outputs/apk/**/*.apk
            tv/build/outputs/apk/**/*.apk
            automotive/build/outputs/apk/**/*.apk
          retention-days: 14
